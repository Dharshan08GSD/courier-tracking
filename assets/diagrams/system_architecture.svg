  <text x="165" y="165" class="module-sub">Real-Time Timeline</text>
  <text x="165" y="180" class="module-sub">Waybill Viewer</text>

  <rect x="280" y="120" width="180" height="75" class="module-box" stroke="#3b82f6" />
