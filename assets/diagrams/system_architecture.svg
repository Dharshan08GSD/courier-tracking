<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 620" width="100%" height="100%">
  <defs>
    <style>
      .title { font-family: 'Segoe UI', Arial, sans-serif; font-size: 20px; font-weight: bold; fill: #1e293b; text-anchor: middle; }
      .subtitle { font-family: 'Segoe UI', Arial, sans-serif; font-size: 13px; fill: #64748b; text-anchor: middle; }
      .tier-box { stroke-width: 2; rx: 8; ry: 8; filter: drop-shadow(0 2px 5px rgba(0,0,0,0.06)); }
      .tier-title { font-family: 'Segoe UI', Arial, sans-serif; font-size: 15px; font-weight: bold; text-anchor: middle; }
      .module-box { fill: #ffffff; stroke-width: 1.5; rx: 6; ry: 6; }
      .module-text { font-family: 'Segoe UI', Arial, sans-serif; font-size: 13px; font-weight: 600; fill: #1e293b; text-anchor: middle; }
      .module-sub { font-family: 'Segoe UI', Arial, sans-serif; font-size: 11px; fill: #64748b; text-anchor: middle; }
      .arrow { stroke: #0284c7; stroke-width: 2.2; fill: none; marker-end: url(#arch-arrow); }
      .protocol-text { font-family: 'Consolas', monospace; font-size: 11px; font-weight: bold; fill: #0369a1; text-anchor: middle; }
    </style>
    <marker id="arch-arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <polygon points="0 1, 8 4, 0 7" fill="#0284c7" />
    </marker>
  </defs>

  <!-- Title & Metadata -->
  <text x="475" y="32" class="title">System Architecture: 3-Tier Multi-Module Courier Platform</text>
  <text x="475" y="55" class="subtitle">Scenario 26 | Student: Dharshan S (732925ITR026) | Class: 25IT3A | VCET IT</text>

