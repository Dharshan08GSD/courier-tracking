  <rect x="50" y="455" width="850" height="135" class="tier-box" fill="#faf5ff" stroke="#a855f7" />
  <text x="475" y="480" class="tier-title" fill="#7e22ce">3. DATA PERSISTENCE &amp; STORAGE TIER (DBMS 25ITT31)</text>

