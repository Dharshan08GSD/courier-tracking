  <text x="575" y="348" class="module-sub">Weight Multipliers</text>
  <text x="575" y="363" class="module-sub">Distance Category Rate</text>
  <text x="575" y="378" class="module-sub">GST Calculation</text>

  <rect x="690" y="305" width="185" height="85" class="module-box" stroke="#22c55e" />
  <text x="782" y="328" class="module-text">Python Analytics Engine</text>
  <text x="782" y="348" class="module-sub">Pandas &amp; NumPy Cleaning</text>
  <text x="782" y="363" class="module-sub">IQR Outlier Detection</text>
  <text x="782" y="378" class="module-sub">Seaborn / Matplotlib</text>

  <!-- Connectors Tier 2 to Tier 3 -->
  <line x1="260" y1="410" x2="260" y2="450" class="arrow" />
  <text x="260" y="435" class="protocol-text">JDBC / SQL</text>

  <line x1="680" y1="410" x2="680" y2="450" class="arrow" />
  <text x="680" y="435" class="protocol-text">SQLAlchemy / CSV</text>

