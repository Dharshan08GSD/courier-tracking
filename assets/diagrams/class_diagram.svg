<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 780" width="100%" height="100%">
  <defs>
    <style>
      .title { font-family: 'Segoe UI', Arial, sans-serif; font-size: 20px; font-weight: bold; fill: #1e293b; text-anchor: middle; }
      .subtitle { font-family: 'Segoe UI', Arial, sans-serif; font-size: 13px; fill: #64748b; text-anchor: middle; }
      .class-box { fill: #f8fafc; stroke: #334155; stroke-width: 2; }
      .class-name-box { fill: #f1f5f9; stroke: #334155; stroke-width: 2; }
      .class-name { font-family: 'Segoe UI', Arial, sans-serif; font-size: 15px; font-weight: bold; fill: #0f172a; text-anchor: middle; dominant-baseline: central; }
      .class-abstract { font-family: 'Segoe UI', Arial, sans-serif; font-size: 11px; font-style: italic; fill: #64748b; text-anchor: middle; }
      .class-member { font-family: 'Consolas', monospace, sans-serif; font-size: 12px; fill: #1e293b; }
      .divider { stroke: #334155; stroke-width: 1.5; }
      .inherit-line { stroke: #0f172a; stroke-width: 2; fill: none; }
      .assoc-line { stroke: #475569; stroke-width: 1.8; stroke-dasharray: 4,4; fill: none; }
      .multiplicity { font-family: 'Segoe UI', Arial; font-size: 12px; font-weight: bold; fill: #0369a1; }
    </style>
    <!-- UML Inheritance Triangular Arrowhead -->
    <marker id="generalization" markerWidth="14" markerHeight="14" refX="13" refY="7" orient="auto">
      <polygon points="1 1, 13 7, 1 13" fill="#ffffff" stroke="#0f172a" stroke-width="2" />
    </marker>
  </defs>

  <!-- Title & Metadata -->
  <text x="475" y="32" class="title">UML Class Diagram: Courier Domain Architecture</text>
  <text x="475" y="55" class="subtitle">Scenario 26 | Student: Dharshan S (732925ITR026) | Class: 25IT3A | VCET IT</text>

  <!-- ================= TOP: ASSOCIATED CLASSES ================= -->
  
  <!-- Class: Customer -->
  <g id="class-customer" transform="translate(60, 90)">
    <rect x="0" y="0" width="220" height="150" class="class-box" />
    <rect x="0" y="0" width="220" height="36" class="class-name-box" />
    <text x="110" y="22" class="class-name">Customer</text>
    <line x1="0" y1="36" x2="220" y2="36" class="divider" />
    <text x="10" y="54" class="class-member">+ customerId: int</text>
    <text x="10" y="70" class="class-member">+ name: String</text>
    <text x="10" y="86" class="class-member">+ phone: String</text>
    <text x="10" y="102" class="class-member">+ city: String</text>
    <line x1="0" y1="112" x2="220" y2="112" class="divider" />
    <text x="10" y="130" class="class-member">+ getContactInfo(): String</text>
  </g>

  <!-- Class: DeliveryPersonnel -->
  <g id="class-delivery-personnel" transform="translate(670, 90)">
    <rect x="0" y="0" width="220" height="150" class="class-box" />
    <rect x="0" y="0" width="220" height="36" class="class-name-box" />
    <text x="110" y="22" class="class-name">DeliveryPersonnel</text>
    <line x1="0" y1="36" x2="220" y2="36" class="divider" />
    <text x="10" y="54" class="class-member">+ personnelId: int</text>
    <text x="10" y="70" class="class-member">+ name: String</text>
    <text x="10" y="86" class="class-member">+ vehicleType: String</text>
    <text x="10" y="102" class="class-member">+ activeDeliveries: int</text>
    <line x1="0" y1="112" x2="220" y2="112" class="divider" />
    <text x="10" y="130" class="class-member">+ assignParcel(p: Parcel)</text>
    <text x="10" y="144" class="class-member">+ completeDelivery()</text>
  </g>

  <!-- ================= CENTER: SUPERCLASS PARCEL ================= -->
  <g id="class-parcel" transform="translate(330, 90)">
    <rect x="0" y="0" width="290" height="235" class="class-box" />
    <rect x="0" y="0" width="290" height="48" class="class-name-box" />
    <text x="145" y="18" class="class-abstract">«abstract»</text>
    <text x="145" y="36" class="class-name">Parcel</text>
    <line x1="0" y1="48" x2="290" y2="48" class="divider" />
    <text x="12" y="66" class="class-member"># parcelId: int</text>
    <text x="12" y="82" class="class-member"># trackingNumber: String</text>
    <text x="12" y="98" class="class-member"># receiverName: String</text>
    <text x="12" y="114" class="class-member"># destinationCity: String</text>
    <text x="12" y="130" class="class-member"># weightKg: double</text>
    <text x="12" y="146" class="class-member"># totalCharge: double</text>
    <text x="12" y="162" class="class-member"># currentStatus: String</text>
    <line x1="0" y1="172" x2="290" y2="172" class="divider" />
    <text x="12" y="190" class="class-member">+ calculatePricing(): void*</text>
    <text x="12" y="206" class="class-member">+ updateStatus(status, loc): void</text>
    <text x="12" y="222" class="class-member">+ displayWaybill(): void</text>
  </g>

  <!-- Association from Customer to Parcel -->
  <line x1="280" y1="165" x2="330" y2="165" class="assoc-line" />
  <text x="290" y="155" class="multiplicity">1</text>
  <text x="315" y="155" class="multiplicity">0..*</text>

  <!-- Association from Parcel to DeliveryPersonnel -->
  <line x1="620" y1="165" x2="670" y2="165" class="assoc-line" />
  <text x="630" y="155" class="multiplicity">0..*</text>
  <text x="655" y="155" class="multiplicity">0..1</text>

  <!-- ================= BOTTOM: SUBCLASSES (INHERITANCE) ================= -->

  <!-- Subclass 1: StandardParcel (Left) -->
  <g id="class-standard" transform="translate(60, 440)">
    <rect x="0" y="0" width="240" height="150" class="class-box" />
    <rect x="0" y="0" width="240" height="36" class="class-name-box" />
    <text x="120" y="22" class="class-name">StandardParcel</text>
    <line x1="0" y1="36" x2="240" y2="36" class="divider" />
    <text x="10" y="55" class="class-member">- baseRatePerKg: double = 40.0</text>
    <text x="10" y="73" class="class-member">- transitDays: int = 3</text>
    <text x="10" y="91" class="class-member">- groundTransport: boolean</text>
    <line x1="0" y1="102" x2="240" y2="102" class="divider" />
    <text x="10" y="122" class="class-member">+ calculatePricing(): void</text>
    <text x="10" y="140" class="class-member">+ getEstimatedDays(): int</text>
  </g>

  <!-- Subclass 2: ExpressParcel (Center) -->
  <g id="class-express" transform="translate(355, 440)">
    <rect x="0" y="0" width="240" height="150" class="class-box" />
    <rect x="0" y="0" width="240" height="36" class="class-name-box" />
    <text x="120" y="22" class="class-name">ExpressParcel</text>
    <line x1="0" y1="36" x2="240" y2="36" class="divider" />
    <text x="10" y="55" class="class-member">- expressSurcharge: double = 75.0</text>
    <text x="10" y="73" class="class-member">- airPriorityFlag: boolean = true</text>
    <text x="10" y="91" class="class-member">- guaranteedHours: int = 24</text>
    <line x1="0" y1="102" x2="240" y2="102" class="divider" />
    <text x="10" y="122" class="class-member">+ calculatePricing(): void</text>
    <text x="10" y="140" class="class-member">+ triggerPriorityAlert(): void</text>
  </g>

  <!-- Subclass 3: SameDayParcel (Right) -->
  <g id="class-sameday" transform="translate(650, 440)">
    <rect x="0" y="0" width="240" height="150" class="class-box" />
    <rect x="0" y="0" width="240" height="36" class="class-name-box" />
    <text x="120" y="22" class="class-name">SameDayParcel</text>
    <line x1="0" y1="36" x2="240" y2="36" class="divider" />
    <text x="10" y="55" class="class-member">- rushPremium: double = 120.0</text>
    <text x="10" y="73" class="class-member">- cutoffTime: LocalTime</text>
    <text x="10" y="91" class="class-member">- directCourierAssigned: boolean</text>
    <line x1="0" y1="102" x2="240" y2="102" class="divider" />
    <text x="10" y="122" class="class-member">+ calculatePricing(): void</text>
    <text x="10" y="140" class="class-member">+ verifySameDayEligibility()</text>
  </g>

  <!-- ================= INHERITANCE ARROWS (Matching Image 3) ================= -->
  <!-- Left to Center Up -->
  <path d="M 180,440 L 180,380 L 475,380 L 475,325" class="inherit-line" marker-end="url(#generalization)" />
  <!-- Center Up -->
  <path d="M 475,440 L 475,325" class="inherit-line" />
  <!-- Right to Center Up -->
  <path d="M 770,440 L 770,380 L 475,380" class="inherit-line" />

  <!-- Association / Composition: TrackingUpdate & DeliveryAttempt -->
  <g id="class-audit" transform="translate(300, 640)">
    <rect x="0" y="0" width="350" height="100" class="class-box" />
    <rect x="0" y="0" width="350" height="30" class="class-name-box" />
    <text x="175" y="18" class="class-name">TrackingUpdate &amp; DeliveryAttempt</text>
    <line x1="0" y1="30" x2="350" y2="30" class="divider" />
    <text x="10" y="48" class="class-member">+ updateId: int | attemptId: int</text>
    <text x="10" y="66" class="class-member">+ status: String | failureReason: String</text>
    <text x="10" y="84" class="class-member">+ location: String | timestamp: LocalDateTime</text>
  </g>
</svg>
