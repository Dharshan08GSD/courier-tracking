<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 680" width="100%" height="100%">
  <defs>
    <style>
      .title { font-family: 'Segoe UI', Arial, sans-serif; font-size: 20px; font-weight: bold; fill: #1e293b; text-anchor: middle; }
      .subtitle { font-family: 'Segoe UI', Arial, sans-serif; font-size: 13px; fill: #64748b; text-anchor: middle; }
      .main-box { fill: #e0f2fe; stroke: #0284c7; stroke-width: 2.5; rx: 8; ry: 8; }
      .sub-comp { fill: #bae6fd; stroke: #0369a1; stroke-width: 1.8; rx: 4; ry: 4; }
      .comp-header { font-family: 'Segoe UI', Arial, sans-serif; font-size: 11px; fill: #0369a1; text-anchor: middle; font-style: italic; }
      .comp-title { font-family: 'Segoe UI', Arial, sans-serif; font-size: 14px; font-weight: bold; fill: #0f172a; text-anchor: middle; }
      .port { fill: #38bdf8; stroke: #0284c7; stroke-width: 1.5; }
      .connector { stroke: #0369a1; stroke-width: 1.8; fill: none; }
      .lollipop { fill: #ffffff; stroke: #0284c7; stroke-width: 2; }
      .socket { fill: none; stroke: #0284c7; stroke-width: 2; }
      .label-red { font-family: 'Segoe UI', Arial, sans-serif; font-size: 12px; font-weight: bold; fill: #e11d48; text-anchor: middle; }
      .iface-label { font-family: 'Segoe UI', Arial, sans-serif; font-size: 12px; font-weight: 600; fill: #334155; }
      .comp-icon { fill: none; stroke: #0284c7; stroke-width: 1.2; }
    </style>
  </defs>

  <!-- Title & Metadata -->
  <text x="475" y="32" class="title">UML 2.0 Component Diagram: Courier Management System</text>
  <text x="475" y="55" class="subtitle">Scenario 26 | Student: Dharshan S (732925ITR026) | Class: 25IT3A | VCET IT</text>

  <!-- Outer Annotation: Component -->
  <text x="475" y="85" class="label-red">« Component Boundary »</text>

  <!-- Main System Component Boundary -->
  <rect x="180" y="95" width="590" height="540" class="main-box" />
  
  <!-- Outer Component Decorator Icon in top right corner -->
  <rect x="735" y="105" width="22" height="18" fill="#bae6fd" stroke="#0284c7" stroke-width="1.2" />
  <rect x="730" y="108" width="8" height="4" fill="#ffffff" stroke="#0284c7" stroke-width="1" />
  <rect x="730" y="115" width="8" height="4" fill="#ffffff" stroke="#0284c7" stroke-width="1" />
  <text x="475" y="125" class="comp-header">«component»</text>
  <text x="475" y="145" class="comp-title" font-size="16">CourierTrackingSystem</text>

  <!-- ================= LEFT: PROVIDED INTERFACES (Lollipops) ================= -->
  <text x="85" y="195" class="label-red">Provided Interface</text>

  <!-- Port 1: Booking API -->
  <line x1="85" y1="230" x2="165" y2="230" class="connector" />
  <circle cx="85" cy="230" r="8" class="lollipop" />
  <text x="85" y="252" class="iface-label" text-anchor="middle">Booking API</text>
  <rect x="172" y="222" width="16" height="16" class="port" />

  <!-- Port 2: Tracking Query -->
  <line x1="85" y1="350" x2="165" y2="350" class="connector" />
  <circle cx="85" cy="350" r="8" class="lollipop" />
  <text x="85" y="372" class="iface-label" text-anchor="middle">Tracking Query</text>
  <rect x="172" y="342" width="16" height="16" class="port" />

  <!-- Port 3: Admin / Dispatch UI -->
  <line x1="85" y1="470" x2="165" y2="470" class="connector" />
  <circle cx="85" cy="470" r="8" class="lollipop" />
  <text x="85" y="492" class="iface-label" text-anchor="middle">Dispatcher UI</text>
  <rect x="172" y="462" width="16" height="16" class="port" />

  <text x="180" y="210" class="label-red" font-size="11">Port</text>

  <!-- ================= INTERNAL COMPONENTS ================= -->
  
  <!-- Central Component: TrackingEngine -->
  <rect x="290" y="240" width="160" height="140" class="sub-comp" />
  <text x="370" y="265" class="comp-header">«component»</text>
  <text x="370" y="285" class="comp-title">TrackingEngine</text>
  <text x="370" y="305" font-family="'Segoe UI', Arial" font-size="11" fill="#475569" text-anchor="middle">• Status Manager</text>
  <text x="370" y="322" font-family="'Segoe UI', Arial" font-size="11" fill="#475569" text-anchor="middle">• Checkpoint Auditing</text>
  <text x="370" y="340" font-family="'Segoe UI', Arial" font-size="11" fill="#475569" text-anchor="middle">• Attempt Logger</text>

  <!-- Top-Right Component: DispatchManager -->
  <rect x="540" y="170" width="170" height="90" class="sub-comp" />
  <text x="625" y="195" class="comp-header">«component»</text>
  <text x="625" y="215" class="comp-title">DispatchManager</text>
  <text x="625" y="235" font-family="'Segoe UI', Arial" font-size="11" fill="#475569" text-anchor="middle">• Agent Assignment</text>
  <text x="625" y="250" font-family="'Segoe UI', Arial" font-size="11" fill="#475569" text-anchor="middle">• Workload Balancer</text>

  <!-- Bottom-Left Component: PricingCalculator -->
  <rect x="280" y="470" width="170" height="85" class="sub-comp" />
  <text x="365" y="495" class="comp-header">«component»</text>
  <text x="365" y="515" class="comp-title">PricingCalculator</text>
  <text x="365" y="535" font-family="'Segoe UI', Arial" font-size="11" fill="#475569" text-anchor="middle">• Weight &amp; Route Rates</text>

  <!-- Bottom-Right Component: AnalyticsEngine -->
  <rect x="540" y="450" width="170" height="95" class="sub-comp" />
  <text x="625" y="475" class="comp-header">«component»</text>
  <text x="625" y="495" class="comp-title">AnalyticsEngine</text>
  <text x="625" y="515" font-family="'Segoe UI', Arial" font-size="11" fill="#475569" text-anchor="middle">• Python Pandas EDA</text>
  <text x="625" y="530" font-family="'Segoe UI', Arial" font-size="11" fill="#475569" text-anchor="middle">• Delivery Delay Trends</text>

  <!-- Connectors from Ports to Internal Components -->
  <line x1="188" y1="230" x2="235" y2="230" class="connector" />
  <circle cx="235" cy="230" r="7" class="lollipop" />
  <path d="M 245,223 A 9 9 0 0 1 245,237" class="socket" />
  <line x1="245" y1="230" x2="290" y2="280" class="connector" />

  <line x1="188" y1="350" x2="290" y2="350" class="connector" />
  
  <line x1="188" y1="470" x2="280" y2="500" class="connector" />

  <!-- Internal Connectors (Lollipop and Socket Assembly) -->
  <!-- TrackingEngine to DispatchManager -->
  <line x1="450" y1="290" x2="485" y2="290" class="connector" />
  <circle cx="485" cy="290" r="7" class="lollipop" />
  <text x="485" y="275" font-size="10" font-family="'Segoe UI'" text-anchor="middle">Agent</text>
  <path d="M 495,283 A 9 9 0 0 1 495,297" class="socket" />
  <path d="M 495,290 L 540,240" class="connector" />

  <!-- TrackingEngine to PricingCalculator -->
  <line x1="365" y1="380" x2="365" y2="420" class="connector" />
  <circle cx="365" cy="420" r="7" class="lollipop" />
  <path d="M 358,430 A 9 9 0 0 1 372,430" class="socket" />
  <line x1="365" y1="430" x2="365" y2="470" class="connector" />

  <!-- TrackingEngine to AnalyticsEngine -->
  <path d="M 450,340 L 510,340 L 510,480" class="connector" />
  <circle cx="510" cy="480" r="7" class="lollipop" />
  <path d="M 520,473 A 9 9 0 0 1 520,487" class="socket" />
  <line x1="520" y1="480" x2="540" y2="480" class="connector" />

  <!-- ================= RIGHT: REQUIRED INTERFACES (Sockets) ================= -->
  <text x="860" y="195" class="label-red">Required Interface</text>

  <!-- Port Right 1: Payment Gateway -->
  <rect x="762" y="222" width="16" height="16" class="port" />
  <line x1="710" y1="230" x2="762" y2="230" class="connector" />
  <line x1="778" y1="230" x2="840" y2="230" class="connector" />
  <path d="M 840,218 A 12 12 0 0 1 840,242" class="socket" />
  <text x="855" y="252" class="iface-label" text-anchor="middle">Payment Gateway</text>

  <!-- Port Right 2: SMS Notification API -->
  <rect x="762" y="342" width="16" height="16" class="port" />
  <line x1="450" y1="320" x2="762" y2="350" class="connector" />
  <line x1="778" y1="350" x2="840" y2="350" class="connector" />
  <path d="M 840,338 A 12 12 0 0 1 840,362" class="socket" />
  <text x="855" y="372" class="iface-label" text-anchor="middle">SMS / Push Alerts</text>

  <!-- Port Right 3: Relational Database (MySQL / SQLite) -->
  <rect x="762" y="472" width="16" height="16" class="port" />
  <line x1="710" y1="480" x2="762" y2="480" class="connector" />
  <line x1="778" y1="480" x2="840" y2="480" class="connector" />
  <path d="M 840,468 A 12 12 0 0 1 840,492" class="socket" />
  <text x="855" y="502" class="iface-label" text-anchor="middle">DBMS (courier_db)</text>
</svg>
